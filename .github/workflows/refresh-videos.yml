name: Refresh Free Kinzo Video Index
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-videos.mjs'
      - '.github/workflows/refresh-videos.yml'
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kinzo-free-media-index
  cancel-in-progress: false
jobs:
  refresh-videos:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run free Wikimedia + curated index
        run: node scripts/refresh-videos.mjs
      - name: Update cached videos
        run: |
          if [[ -n "$(git status --porcelain -- data/videos.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "data: update free playable video index"
            git pull --rebase -X theirs origin main
            git push origin HEAD:main
          fi
