name: Refresh Kinzo News Cache
on:
  push:
    branches: [main]
    paths:
      - 'scripts/refresh-news.mjs'
      - '.github/workflows/refresh-news.yml'
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: kinzo-news-cache
  cancel-in-progress: false
jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate and test script
        run: |
          node --check scripts/refresh-news.mjs
          node --test tests/news-cache.test.js
      - name: Collect recent publisher links
        run: node scripts/refresh-news.mjs
      - name: Commit cache if data changed
        run: |
          if [[ -n "$(git status --porcelain -- data/news.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/news.json
            git commit -m "data: refresh verified news references"
            git push origin HEAD:main
          else
            echo "No new news data to commit"
          fi
