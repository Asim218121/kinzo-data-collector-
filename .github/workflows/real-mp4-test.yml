name: Verify Real External MP4 Playback
on:
  push:
    branches: [main]
    paths:
      - 'tests/real-video-smoke.mjs'
      - '.github/workflows/real-mp4-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remote-playback:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --no-save playwright@1.60.0
          which google-chrome
      - name: Verify real MP4 plays, not just preview card
        run: node tests/real-video-smoke.mjs
