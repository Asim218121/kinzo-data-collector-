name: Kinzo Browser Smoke Test
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'index.html'
      - 'data/news.json'
      - 'tests/browser-smoke.mjs'
      - '.github/workflows/browser-test.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  chromium-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate JavaScript and unit tests
        run: |
          node --check src/app.js
          node --check src/research.js
          node --check scripts/refresh-news.mjs
          npm test
      - name: Install browser test dependencies
        run: |
          npm install --no-save playwright@1.60.0
          which google-chrome || which google-chrome-stable || which chromium
      - name: Test real Chromium interface
        run: node tests/browser-smoke.mjs
